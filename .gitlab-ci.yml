# ==============================================================================
# OmniRoute-LLM - Windows Runner CI/CD Matrix
# ==============================================================================

stages:
  - verify
  - build

default:
  tags:
    - windows
    - powershell

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

verify_and_lint:
  stage: verify
  script:
    - npm install
    - npx vitest run --passWithNoTests
  allow_failure: true
